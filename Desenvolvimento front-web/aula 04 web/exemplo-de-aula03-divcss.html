<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div com css</title>
    
    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10;
        }
        #principal{
            background-color: blue;
            border: 5px solid violet;
            color: aliceblue;
        }
        #secundaria{
            background-color: black;
            border: 5px solid red;
            color: white;
        }
        hr{
            border: none;
            border-top: 3px solid grey;
            width: 90%;
        }
    </style>

</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr/>
    <div id="secundaria">
        Esta é o outra divisão da página
        <br>
        Aqui começa outra linha
    </div>
</body>
</html>
