<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Descubra</title>
</head>
<body>
    <h1>Descubra</h1>
    <h2>Descubra seu caminho em Front-End</h2>
    <form>
    <div class="nome">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
    </div>
    <div class="interesse">
        
            <label for="escolha">Full-Stack</label>
            <input type="radio" id="Full-Stack-" name="Full-Stack">

            <label for="radio">Cibersegurança</label>
            <input type="radio" id="Ciber" name="Ciber">

            <label for="radio">Ciência de Dados</label>
            <input type="radio" id="Dados" name="Dados">

            <label for="radio">Cloud</label>
            <input type="radio" id="Cloud" name="Cloud">

            <label for="radio">Infraestrutura e Redes</label>
            <input type="radio" id="Infra" name="Infra">
            
            <label for="radio">Inteligência Articial/ML</label>
            <input type="radio" id="IA" name="IA">
        
            <button type="submit">Enviar</button>
    </div>
    </form>
    
</body>
</html>
