<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classe e id</title>
    <style>
        .caixa{
            border: 3px solid red;
            background-color: white;
            color: red;
            padding: 10px;
        }

        #aviso {
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de classe e id</h1>

    <p>Parágrafo comum da página.</p>
    
    <div>
        Está é ua div sem formatação
    </div>
    <br>

    <div class="caixa" id="aviso">
        Está div ultiliza a classe caixa e o identiicador aviso.
    </div>

    <br>

    <span>
        Este é um span sem formatação.
    </span>

    <span class="caixa">
        Esta é um span ultizando a classe caixa.
    </span>
</body>
</html>
