<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classes e CSS interno</title>
    <style>
        .titulo{
            color: rgb(164, 158, 240);
            text-align: center;
        }
        
        .caixa01{
            background-color: rgb(125, 186, 226);
            border: 2px solid rgb(0, 0, 0);
            padding: 20px;
            margin:20px;
        }

        .caixa02{
            background-color: rgb(248, 169, 169);
            border: 2px solid rgb(0, 0, 0);
            padding: 20px;
            margin:20px;
        }

        .destaque01{
            color: navy;
            font-weight: bold;
        }

        .destaque02{
            color: rgb(128, 0, 28);
            background-color: bisque;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendoa utilizar classes para personalizar os elementos de uma página.
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utilizar a classe destaque01.
        </p>
        <br>
        <p class="destaque02">
            Este parágrafo utilizar a classe destaque02.
        </p>
    </div>
    <div class="caixa02">
        <p>Este parágrafo não utilizar nenhuma classe.</p>

    </div>
</body>
</html>
